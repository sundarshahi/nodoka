name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Minimum supported Rust version (1.85)
        run: rustup toolchain install 1.85 --profile minimal && cargo +1.85 check --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # a hang fails after 15 minutes with its log, instead of running until cancelled with none
      - run: perl -e 'alarm shift; exec @ARGV' 900 cargo test --all-targets --locked
      - name: Node preload (worker cap, memory pressure, off switch)
        run: node preload/test.cjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked

  windows-install:
    # the real thing on a Windows machine: install.ps1, the helper running, settings in place, and
    # uninstall putting everything back
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release --locked
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $d = Join-Path $env:RUNNER_TEMP 'rel'; New-Item -ItemType Directory $d | Out-Null
          $zip = 'nodoka-x86_64-pc-windows-msvc.zip'
          Compress-Archive target/release/nodoka.exe (Join-Path $d $zip)
          "$((Get-FileHash (Join-Path $d $zip) -Algorithm SHA256).Hash.ToLower())  $zip" | Out-File -Encoding ascii (Join-Path $d "$zip.sha256")
          $env:NODOKA_BASE_URL = $d
          ./install.ps1
          $no = [Environment]::GetEnvironmentVariable('NODE_OPTIONS', 'User')
          if ($no -notmatch 'nodoka/preload.cjs') { throw "NODE_OPTIONS not set: $no" }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -notmatch '\.nodoka\\bin') { throw 'bin folder not on the user Path' }
          if (-not (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).nodoka) { throw 'no Run entry' }
          $status = Join-Path $env:USERPROFILE '.nodoka\status'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $status); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $status)) { throw 'the helper never wrote its status' }
          $exe = Join-Path $env:USERPROFILE '.nodoka\bin\nodoka.exe'
          & $exe status
          & $exe uninstall
          if ([Environment]::GetEnvironmentVariable('NODE_OPTIONS', 'User')) { throw 'NODE_OPTIONS left behind' }
          if ((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).nodoka) { throw 'Run entry left behind' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -match '\.nodoka\\bin') { throw 'bin folder left on the Path' }
          if (Get-Process nodoka -ErrorAction SilentlyContinue) { throw 'helper still running' }
          'install, run and uninstall: ok'

  windows-notice:
    # the script WSL runs for the low-memory notice, on real Windows (text with quotes and $() in it)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: powershell
        env:
          NODOKA_TITLE: Memory is full
          NODOKA_BODY: firefox 7 GB, Code 13 GB; it's $(not run)
        run: powershell -NoProfile -NonInteractive -Command (Get-Content -Raw src/sys/toast.ps1)
