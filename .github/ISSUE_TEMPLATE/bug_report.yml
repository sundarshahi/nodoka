name: Bug report
description: loadline did something it shouldn't, or didn't do something it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `loadline status` at the time (if you can)
      render: text
  - type: textarea
    id: explain
    attributes:
      label: Output of `loadline explain <pid>` for the process involved
      render: text
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from ~/.loadline/log
      render: text
  - type: input
    id: version
    attributes:
      label: loadline version and OS
      placeholder: "loadline 0.1.0, macOS 15.2 (Apple silicon)"
    validations:
      required: true
