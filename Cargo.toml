[package]
name = "nodoka"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Keeps your computer responsive while dev servers, builds, installs and AI coding agents run — any stack, no new commands."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sundarshahi/nodoka"
readme = "README.md"
keywords = ["developer-tools", "performance", "memory", "dev-server", "agents"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/docs/overview.html"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
